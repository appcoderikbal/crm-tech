# Local WordPress for developing and testing the plugin.
#
# The plugin directory is bind-mounted into wp-content/plugins, so edits on the
# host appear immediately inside WordPress — no rebuild, no copying.
#
#   docker compose up -d
#   open http://localhost:8080   (complete the 2-minute WP install)
#   then activate "Techzapp CRM" under Plugins
#
# Production is Hostinger shared hosting with a normal WordPress install; none
# of this ships with the plugin.

services:
  wordpress:
    image: wordpress:6.8-php8.3-apache
    container_name: techzapp-wp
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - '8080:80'
    environment:
      WORDPRESS_DB_HOST: mysql:3306
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      # Real cron drives the sending pipeline; WP-Cron is disabled so the
      # behaviour matches the recommended production setup.
      WORDPRESS_DEBUG: '1'
      WORDPRESS_CONFIG_EXTRA: |
        /* The image already defines WP_DEBUG when WORDPRESS_DEBUG is set. */
        if ( ! defined( 'WP_DEBUG_LOG' ) )     { define( 'WP_DEBUG_LOG', true ); }
        if ( ! defined( 'WP_DEBUG_DISPLAY' ) ) { define( 'WP_DEBUG_DISPLAY', false ); }
        if ( ! defined( 'DISABLE_WP_CRON' ) )  { define( 'DISABLE_WP_CRON', true ); }
        if ( ! defined( 'TECHZAPP_CRM_MAIL_TRANSPORT' ) ) { define( 'TECHZAPP_CRM_MAIL_TRANSPORT', 'log' ); }
    volumes:
      - wp-data:/var/www/html
      - ./techzapp-crm:/var/www/html/wp-content/plugins/techzapp-crm

  mysql:
    image: mysql:8.4
    container_name: techzapp-wp-mysql
    restart: unless-stopped
    command:
      - --default-time-zone=+00:00
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpress
    ports:
      - '3306:3306'
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-u', 'root', '-proot']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  # WP-CLI for migrations, test fixtures and running the cron workers by hand.
  #   docker compose run --rm wpcli wp plugin activate techzapp-crm
  wpcli:
    image: wordpress:cli-php8.3
    container_name: techzapp-wp-cli
    depends_on:
      mysql:
        condition: service_healthy
      wordpress:
        condition: service_started
    user: '33:33'
    environment:
      WORDPRESS_DB_HOST: mysql:3306
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
    volumes:
      - wp-data:/var/www/html
      - ./techzapp-crm:/var/www/html/wp-content/plugins/techzapp-crm
    entrypoint: ['wp']
    command: ['--info']

volumes:
  wp-data:
  mysql-data:
