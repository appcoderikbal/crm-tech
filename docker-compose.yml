# Local development database only.
#
# Production runs on Hostinger's managed MySQL — see docs/DEPLOYMENT.md. This
# file exists so a developer gets the same MySQL 8.4 the test suite was written
# against, without installing a server.
#
#   docker compose up -d          start
#   docker compose logs -f mysql  watch startup
#   docker compose down           stop (data is kept in the named volume)
#   docker compose down -v        stop and delete the data

services:
  mysql:
    image: mysql:8.4
    container_name: techzapp-crm-mysql
    restart: unless-stopped
    command:
      # The application stores and compares every timestamp in UTC.
      - --default-time-zone=+00:00
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      # Matches the shared-hosting profile the app is written for, so local
      # development hits the same limits as production rather than a roomier box.
      - --max-connections=50
      - --innodb-buffer-pool-size=256M
    environment:
      # Local credentials only. Real secrets live in backend/config/config.php,
      # which is git-ignored and never committed.
      MYSQL_ROOT_PASSWORD: techzapp_root
      MYSQL_DATABASE: techzapp_crm
      MYSQL_USER: techzapp
      MYSQL_PASSWORD: techzapp_dev
    ports:
      - '3306:3306'
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      # Wait for real query readiness, not just an open port — migrations run
      # immediately after this reports healthy.
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-u', 'root', '-ptechzapp_root']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  # Second database for the integration test suite, which TRUNCATEs every table.
  # Keeping it separate means running the tests never wipes your dev data.
  mysql-test:
    image: mysql:8.4
    container_name: techzapp-crm-mysql-test
    restart: unless-stopped
    command:
      - --default-time-zone=+00:00
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: techzapp_root
      MYSQL_DATABASE: techzapp_crm_test
    ports:
      - '3307:3306'
    tmpfs:
      # Test data is disposable; keeping it in RAM makes the suite noticeably
      # faster and leaves nothing behind.
      - /var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-u', 'root', '-ptechzapp_root']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  mysql-data:
